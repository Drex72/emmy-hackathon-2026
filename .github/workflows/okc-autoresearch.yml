name: OKC Five-Board Autoresearch

on:
  push:
    branches: [okc-autoresearch]
    paths:
      - "okc-autoresearch/TRIGGER4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: okc-five-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-wave:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore first-wave executor
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d okc-autoresearch/first_wave.py.gz.b64 | gzip -d > "$RUNNER_TEMP/first_wave.py"
          python -m py_compile "$RUNNER_TEMP/first_wave.py"
          sha256sum "$RUNNER_TEMP/first_wave.py"

      - name: Install OKC CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --retry 5 --retry-all-errors -fsSL https://openkernelchallenge.dev/install.sh | sh
          CANDIDATE="$(command -v okc || true)"
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE="$(find "$HOME" -type f -name okc -perm -111 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$CANDIDATE" ]; then
            echo "okc binary not found after installer" >&2
            exit 1
          fi
          echo "$(dirname "$CANDIDATE")" >> "$GITHUB_PATH"
          sudo ln -sf "$CANDIDATE" /usr/local/bin/okc
          okc --version || okc version || true

      - name: Device login (encrypted handshake)
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/okc-login.log"
          PUB="$RUNNER_TEMP/device-code-public.pem"
          cat > "$PUB" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuJTvLVFd/+Al+Pf6EQ1p
          dBVh7Su0fFYn19br+Vp/M7WXEnXW4VgUqOwmR2GgnkcWpYCv8qrAMcaOu7I42+FB
          OXcxCz+sr12kekp7AX5WLkKzGJ41XRdLqs57RHOUZXjzOyC4kxQ3XSVyB4r7ECb5
          7+lCl7WbYe2oeSTEHYFxPVkcVS2yKpVq0//bhtKtsKYS13ADT51jwMod6iYBjarb
          eAHtvjodnG2HinL0JvKmWLgBlBNewLK117A4M9gX2pc5PLw/nMcP5xOsOelsWyIC
          1fNId8yryJLK+L/fzAr23dRtodZvGDn1lmd7n1eVCgjRVeTGUy5hCqo7bk/sVbR3
          tQIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          sed -i 's/^          //' "$PUB"
          : > "$LOG"

          # The CLI first asks for explicit acceptance of the official rules.
          # Keep all CLI output off public stdout; only the encrypted device code is printed.
          { printf 'y\\n'; sleep 900; } | script -q -f -c "okc login" "$LOG" >/dev/null 2>&1 &
          LOGIN_PID=$!

          CODE=""
          for _ in $(seq 1 180); do
            CODE="$(tr -d '\r' < "$LOG" \
              | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
              | grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' \
              | tail -1 || true)"
            if [ -n "$CODE" ]; then break; fi
            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then break; fi
            sleep 1
          done

          if [ -z "$CODE" ]; then
            echo "LOGIN_STAGE=failed_before_device_code"
            # Redact anything shaped like a device code before diagnostics.
            tr -d '\r' < "$LOG" \
              | sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-DEVICE-CODE]/g' \
              | tail -80
            kill "$LOGIN_PID" 2>/dev/null || true
            exit 1
          fi

          CIPHER="$(
            printf '%s' "$CODE" \
              | openssl pkeyutl -encrypt -pubin -inkey "$PUB" -pkeyopt rsa_padding_mode:oaep \
              | base64 -w0
          )"
          unset CODE
          echo "LOGIN_STAGE=awaiting_device_authorization"
          echo "OKC_DEVICE_CODE_CIPHERTEXT=$CIPHER"
          echo "DEVICE_URL=https://github.com/login/device"
          export GH_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
          ISSUE_URL="$(gh issue create --repo "$GITHUB_REPOSITORY"             --title "OKC encrypted device login — run $GITHUB_RUN_ID"             --body "Temporary OKC authorization handoff for run **$GITHUB_RUN_ID**.\n\nDevice URL: https://github.com/login/device\n\nEncrypted code (RSA-OAEP):\n\n\`\`\`\n$CIPHER\n\`\`\`\n\nOnly the ephemeral private key held by the research session can decrypt this.")"
          ISSUE_NUM="${ISSUE_URL##*/}"
          echo "DEVICE_CIPHER_ISSUE=$ISSUE_URL"

          if ! wait "$LOGIN_PID"; then
            echo "LOGIN_STAGE=authorization_failed_or_expired"
            exit 1
          fi
          rm -f "$LOG" "$PUB"
          gh issue close "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --comment "Device authorization completed; the H200 checks are starting." || true
          echo "LOGIN_STAGE=authorized"

      - name: Run five-board crossover campaign
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          python first_wave.py

      - name: Upload H200 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okc-five-board-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/okc-run/results/
            ${{ runner.temp }}/okc-run/logs/
            ${{ runner.temp }}/okc-run/sources/
